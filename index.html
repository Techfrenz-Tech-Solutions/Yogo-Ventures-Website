    <!-- ══ STRUCTURED DATA — WebSite + Sitelinks Searchbox ════════════════════

         and directly influence the Sitelinks block title and description.
    ══════════════════════════════════════════════════════════════════════════ -->

    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.yogoventures.com/#website",
      "name": "Yogo Ventures",
      "url": "https://www.yogoventures.com",
      "description": "YoGo Ventures offers premium Fashion, Memory Foam Products, Copper Utensils and Handicraft items. Request quotations for single or bulk orders at the best price.",
      "publisher": { "@id": "https://www.yogoventures.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.yogoventures.com/shop?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "en-IN"
    }
    </script>

      "@context": "https://schema.org",

      "hasPart": [
        {
          "@type": "WebPage",
          "@id": "https://www.yogoventures.com/",
          "name": "Home",
          "url": "https://www.yogoventures.com/",

        {
          "@type": "WebPage",

          "@type": "WebPage",
