# ══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Yogo Ventures
# Optimized for:
#   - Core Web Vitals (LCP, CLS, INP)
#   - Google Search Console Security enhancements
#   - HTTPS / HSTS (applied at reverse proxy / load balancer level)
#   - Gzip + Brotli compression → faster TTFB → better LCP
#   - Long-term asset caching (Vite hashed filenames)
#   - React SPA routing (all paths → index.html)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name yogoventures.com www.yogoventures.com;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────
    # (Enable this block when SSL is terminated at nginx, not a load balancer)
    # return 301 https://$host$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ─────────────────────────────────────────────────
    # Reduces transfer size → faster TTFB → improves LCP score
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Security Headers ─────────────────────────────────────────────────
    # These headers are checked by Google Search Console "Security" report
    # and are a ranking trust signal.

    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://api.yogoventures.com https://images.unsplash.com https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.yogoventures.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://region1.google-analytics.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self';" always;

    # ── SPA Routing — all client-side routes → index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # HTML files: no cache — always revalidate so deployments take effect
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
    }

    # ── Vite Hashed Assets: immutable long-term cache ─────────────────────
    # Vite appends content hashes to filenames (e.g. main.abc123.js)
    # → safe to cache indefinitely
    location /assets/ {
        expires        1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log     off;
    }

    # ── Static Images: 30-day cache ───────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        expires        30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log     off;
    }

    # ── Fonts: 1-year cache ───────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires        1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log     off;
    }

    # ── SEO Files: short cache (Google re-fetches frequently) ────────────
    location = /robots.txt {
        expires    1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        expires    1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /manifest.json {
        expires    1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ── Block hidden files (e.g. .env, .git) ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Block access to source maps in production ─────────────────────────
    location ~* \.map$ {
        deny all;
        access_log off;
    }

    # ── Custom error pages ────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
