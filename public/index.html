<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#335765" />

    <!-- ── SEO Meta Tags ── -->
    <title>Coastal Retreat — Premium Coastal Living Products</title>
    <meta name="description" content="Discover handcrafted coastal products for bath, skincare, home décor, and wellness. Sustainably sourced, reef-safe, and delivered across India and 35+ countries." />
    <meta name="keywords" content="coastal products, reef-safe skincare, marine skincare, sea salt bath, coastal home décor, sustainable beauty, India" />
    <meta name="author" content="Coastal Retreat" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.coastalretreat.in/" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.coastalretreat.in/" />
    <meta property="og:title"       content="Coastal Retreat — Premium Coastal Living Products" />
    <meta property="og:description" content="Handcrafted coastal products that bring the serenity of the sea into your daily rituals. Sustainable, premium, and deeply intentional." />
    <meta property="og:image"       content="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1200&q=80" />
    <meta property="og:site_name"   content="Coastal Retreat" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@coastalretreat" />
    <meta name="twitter:title"       content="Coastal Retreat — Premium Coastal Living Products" />
    <meta name="twitter:description" content="Handcrafted coastal products that bring the serenity of the sea into your daily rituals." />
    <meta name="twitter:image"       content="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1200&q=80" />

    <!-- ── Schema.org JSON-LD ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Coastal Retreat",
      "url": "https://www.coastalretreat.in",
      "logo": "https://www.coastalretreat.in/logo.png",
      "description": "Premium coastal living products — bath, skincare, home décor, and wellness. Sustainably crafted, reef-safe.",
      "foundingDate": "2013",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "12 Coastal Lane",
        "addressLocality": "Pondicherry",
        "postalCode": "605001",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-413-222-5678",
        "contactType": "customer service",
        "availableLanguage": ["English", "Tamil", "Hindi"]
      },
      "sameAs": [
        "https://www.instagram.com/coastalretreat",
        "https://www.facebook.com/coastalretreat",
        "https://www.pinterest.com/coastalretreat"
      ]
    }
    </script>

    <!-- ── Favicon ── -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Google Fonts preconnect ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
